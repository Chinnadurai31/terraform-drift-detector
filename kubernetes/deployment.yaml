# ============================================================
# Namespace
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: terraform-visualizer
---
# ============================================================
# MongoDB Secret
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: terraform-visualizer
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: admin
  MONGO_ROOT_PASSWORD: password
  MONGODB_URI: mongodb://admin:password@mongodb-service:27017

---
# ============================================================
# App ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: tf-visualizer-config
  namespace: terraform-visualizer
data:
  PORT: "5050"
  BACKEND_HOST: "tf-visualizer-backend.terraform-visualizer.svc.cluster.local"
  BACKEND_PORT: "5050"

---
# ============================================================
# StorageClass — dynamic provisioner, auto-creates PV on demand
# Works on: kind / k3s / minikube (rancher.io/local-path)
# On EKS:   swap provisioner to ebs.csi.aws.com
# On GKE:   swap provisioner to pd.csi.storage.gke.io
# ============================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: tf-visualizer-sc
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain

---
# ============================================================
# MongoDB PersistentVolumeClaim
# StorageClass dynamic provisioner creates the PV automatically
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: terraform-visualizer
spec:
  storageClassName: tf-visualizer-sc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ============================================================
# MongoDB Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: terraform-visualizer
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_ROOT_PASSWORD
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc

---
# ============================================================
# MongoDB Service (ClusterIP — only backend needs to reach it)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: terraform-visualizer
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP

---
# ============================================================
# Backend Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tf-visualizer-backend
  namespace: terraform-visualizer
  labels:
    app: tf-visualizer-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tf-visualizer-backend
  template:
    metadata:
      labels:
        app: tf-visualizer-backend
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mongodb-service 27017; do
                echo "waiting for mongodb..."; sleep 2;
              done
      containers:
        - name: backend
          image: chinnadurai123/terraform-state-visualiser:backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5050
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_URI
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tf-visualizer-config
                  key: PORT
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5050
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
# ============================================================
# Backend Service (ClusterIP — frontend talks to it internally)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: tf-visualizer-backend
  namespace: terraform-visualizer
spec:
  selector:
    app: tf-visualizer-backend
  ports:
    - port: 5050
      targetPort: 5050
  type: ClusterIP

---
# ============================================================
# Frontend Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tf-visualizer-frontend
  namespace: terraform-visualizer
  labels:
    app: tf-visualizer-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tf-visualizer-frontend
  template:
    metadata:
      labels:
        app: tf-visualizer-frontend
    spec:
      containers:
        - name: frontend
          image: chinnadurai123/terraform-state-visualiser:frontend-v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: tf-visualizer-config
                  key: BACKEND_HOST
            - name: BACKEND_PORT
              valueFrom:
                configMapKeyRef:
                  name: tf-visualizer-config
                  key: BACKEND_PORT
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
# ============================================================
# Frontend Service (NodePort — exposed to outside)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: tf-visualizer-frontend
  namespace: terraform-visualizer
spec:
  selector:
    app: tf-visualizer-frontend
  ports:
    - port: 80
      targetPort: 80
  type: NodePort

